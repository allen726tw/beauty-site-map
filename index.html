<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美業選址小幫手</title>
<link rel="stylesheet" href="leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f0;--line:#e7e4dc;--mute:#77756f;--chip:#f1efe8;--lime:#d7f24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1d1d1b;font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px}
header{background:#141414;color:#fff;padding:12px 18px;font-size:18px;font-weight:900}
.wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:14px;padding:14px;max-width:1300px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr;padding:10px;gap:10px}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sres{position:absolute;z-index:1000;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;box-shadow:0 6px 20px rgba(0,0,0,.08);display:none;max-height:280px;overflow:auto}
.sres div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres div:hover{background:var(--chip)}
.sub{color:var(--mute);font-size:13px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
.seg button.on{background:#141414;color:#fff}
#map{height:600px;border-radius:12px;background:#eef0ea}
@media(max-width:860px){#map{height:380px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.score{display:flex;align-items:center;gap:14px}
.score .n{font-size:56px;font-weight:900;line-height:1}
.score .v{font-size:20px;font-weight:900}
.lines{margin:14px 0 4px}
.lines div{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.lines b{width:42px;flex:none}
.lines span{flex:1}
.lines em{font-style:normal;font-weight:900;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}
.btn.dark{background:#141414;color:#fff;border-color:#141414}
details summary{cursor:pointer;font-weight:700;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.ad{white-space:normal}
.x{border:0;background:none;color:var(--mute);cursor:pointer}
.side{display:flex;flex-direction:column;gap:10px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,245,240,.85);z-index:2000;border-radius:12px;font-weight:700}
.leaflet-container{font-family:inherit}
.rec{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:hover{background:#faf9f5}
.rec .s{font-size:20px;font-weight:900;width:38px;text-align:center}
.rec .nm{font-weight:700}
.pin{background:#141414;color:#d7f24a;font-weight:900;font-size:12px;border-radius:12px;padding:2px 7px;border:2px solid #fff;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
</style>
</head>
<body>
<header>美業選址小幫手</header>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div class="search"><input id="q" placeholder="輸入地址或里名，例如「板橋區新民里」" autocomplete="off"><div class="sres" id="sres"></div></div>
      <div id="hint" class="sub" style="display:none;flex-basis:100%;order:3"></div>
      <div class="seg" id="range"><button data-r="300">300m</button><button data-r="500" class="on">500m</button><button data-r="800">800m</button></div>
    </div>
    <div style="position:relative"><div id="map"></div><div id="loading">載入中…</div></div>
    <div class="legend"><span><i style="background:#2b59c3"></i>百貨商場</span><span><i style="background:#141414"></i>捷運／火車站</span></div>
  </div>
  <div class="side">
    <div class="card" id="res"><div class="sub">點地圖任一處開始</div></div>
    <div class="card" id="cmp" style="display:none"></div>
    <div class="card" id="rec"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<script>
const COL={8:'#2b59c3',9:'#141414'};
const S={r:500,sel:null,cmp:[]};
let MRT=[],PICKS={n:0,list:[]},D,BIZ,DAY={},TOWN={},feats,bbox=[],map,dots,circle,center;
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const P=i=>D.props[i]; // [county,town,vill,area,pop,hh,pop1y,pop5y,f2044,a65,fn,fs,rn,rs,nail,beauty,hair,nailNew]
//CALC-START
const HEAT=[1,40,3,120]; // 每平方公里店數：美甲低標/高標、美容美髮低標/高標
const RAD=Math.PI/180;
const dist=(a,b,c,d)=>{const x=Math.sin((c-a)*RAD/2),y=Math.sin((d-b)*RAD/2);return 12742000*Math.asin(Math.sqrt(x*x+Math.cos(a*RAD)*Math.cos(c*RAD)*y*y))};
const lg=(v,lo,hi)=>Math.max(0,Math.min(100,(Math.log10(Math.max(v,1e-9))-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))*100));
function townArea(){TOWN={};for(const p of D.props){const k=p[0]+p[1];TOWN[k]=(TOWN[k]||0)+p[3]}}
// 開店指數 = 人流 40% + 客群 30% + 美業熱度 30%
function calc(lat,lng,r){
  const c=turf.circle([lng,lat],r/1000,{steps:96,units:'kilometers'}),cb=turf.bbox(c),parts=[];
  for(let i=0;i<feats.length;i++){const b=bbox[i];if(b[2]<cb[0]||b[0]>cb[2]||b[3]<cb[1]||b[1]>cb[3])continue;
    let x=null;try{x=turf.intersect(turf.featureCollection([c,feats[i]]))}catch(e){}
    if(!x)continue;const a=turf.area(x);if(a<1)continue;parts.push({i,frac:Math.min(1,a/turf.area(feats[i])),a})}
  if(!parts.length)return null;
  parts.sort((x,y)=>y.a-x.a);
  let f=0,nail=0,other=0,w=0,sp=0,vs=0;
  for(const {i,frac,a} of parts){const p=P(i);f+=p[8]*frac;nail+=p[14]*frac;other+=(p[15]+p[16])*frac;w+=a;sp+=(p[11]+p[13])/2*a;vs+=(p[10]+p[12])/2*a}
  let mall=0;for(const s of D.stores)if(s[0]===8&&dist(lat,lng,s[1],s[2])<=r)mall++;
  const km2=turf.area(c)/1e6,spend=sp/w,visit=vs/w,anc=P(parts[0].i);
  // 捷運人流：1 公里內各站每日進出人次（11–21 點），300 公尺內全算、到 1 公里遞減到 0
  let mflow=0,nearMrt=1e9,top=null;
  for(const [n,[la,ln,day]] of MRT){const d=dist(lat,lng,la,ln);nearMrt=Math.min(nearMrt,d);const wt=Math.max(0,Math.min(1,(1000-d)/700));if(wt>0){mflow+=day*wt;if(!top||day*wt>top[1])top=[n,day*wt,day]}}
  const hasMrt=nearMrt<3000;
  // 人流：捷運進出人次＋來客熱度，再看步行圈內有沒有百貨商場這類停留型場所
  const walk=hasMrt?0.6*lg(mflow,5000,150000)+0.4*visit:visit;
  const flow=0.8*walk+0.2*Math.min(100,mall*25*Math.pow(500/r,2));
  // 客群：20–44 歲女性密度＋消費熱度＋所在行政區白天活動人口密度
  const dp=DAY[anc[0]+anc[1]],dayDens=dp?(dp[0]+dp[1])/2/(TOWN[anc[0]+anc[1]]/1e6):0;
  const cust=0.5*lg(f/km2,300,8000)+0.3*spend+0.2*lg(dayDens,1000,40000);
  // 美業熱度：美甲、美容、美髮店越多，代表這一帶越有保養消費習慣（加分，不當競爭）
  const heat=0.6*lg(nail/km2,HEAT[0],HEAT[1])+0.4*lg(other/km2,HEAT[2],HEAT[3]);
  const score=Math.round(flow*.4+cust*.3+heat*.3);
  return {lat,lng,parts,f,nail,other,spend,visit,mall,score,mflow,hasMrt,top,flow,cust,heat,dp,anc};
}
//CALC-END

async function init(){
  const [topo,data,biz,picks,mrt,day]=await Promise.all(['villages.topo.json','data.json','biz.json','picks.json','mrt.json','day.json'].map(u=>fetch(u).then(r=>r.json())));
  D=data;BIZ=biz;PICKS=picks;MRT=Object.entries(mrt);DAY=day;townArea();
  feats=topojson.feature(topo,topo.objects.villages).features;
  feats.forEach((f,i)=>bbox[i]=turf.bbox(f));
  map=L.map('map').setView([25.0423,121.544],15);
  map.attributionControl.setPrefix('');
  L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',{maxZoom:19,attribution:'底圖 © 內政部國土測繪中心'}).addTo(map);
  dots=L.layerGroup().addTo(map);
  map.on('moveend',drawDots);
  map.on('click',e=>pick(e.latlng));
  document.getElementById('loading').remove();
  drawDots();renderRec();pick(L.latLng(25.0423,121.544));
}
function renderRec(){
  const ps=PICKS.list;
  ps.forEach(p=>L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="pin">★ ${p.score}</div>`,iconSize:null,iconAnchor:[22,12]})}).on('click',()=>go(L.latLng(p.lat,p.lng))).addTo(map));
  document.getElementById('rec').innerHTML=`<div style="font-weight:900;font-size:17px">台北推薦地點</div>
   <div class="sub" style="margin:4px 0 6px">全台北掃描 ${fmt(PICKS.n)} 個點（500m 圈）。最高 ${ps[0].score} 分，以下是分數最高的 ${ps.length} 區，點一下就跳過去。</div>
   ${ps.map(p=>`<div class="rec" onclick="go(L.latLng(${p.lat},${p.lng}))"><div class="s" style="color:${p.score>=85?'#1f8a4c':'#5d8a14'}">${p.score}</div><div><div class="nm">${p.name}附近 <span class="sub">${p.town}${p.vill}</span></div><div class="sub">${p.why}</div></div></div>`).join('')}
   <div class="sub" style="margin-top:8px">每 200 公尺取一個點計算，相鄰 800 公尺內只留分數最高的一點。分數還沒算進租金，實際仍要看每坪租金與店面條件。</div>`;
}
function drawDots(){
  dots.clearLayers();if(map.getZoom()<12)return;
  const b=map.getBounds().pad(.1);
  for(const s of D.stores){if(s[0]<8||!b.contains([s[1],s[2]]))continue;
    L.circleMarker([s[1],s[2]],{radius:5,color:'#fff',weight:1,fillColor:COL[s[0]],fillOpacity:.95,interactive:false}).addTo(dots)}
}

function pick(ll){
  const s=calc(ll.lat,ll.lng,S.r);if(!s)return;
  s.ll=ll;S.sel=s;
  if(circle)circle.remove();if(center)center.remove();
  circle=L.circle(ll,{radius:S.r,color:'#141414',weight:2.5,fillOpacity:.05,interactive:false}).addTo(map);
  center=L.circleMarker(ll,{radius:7,color:'#141414',weight:3,fillColor:'#d7f24a',fillOpacity:1,interactive:false}).addTo(map);
  render();
}
function verdict(s){
  if(s>=75)return['很適合','#1f8a4c'];if(s>=60)return['可以考慮','#5d8a14'];if(s>=45)return['條件普通','#c98a00'];return['不建議','#d6362b'];
}
function render(){
  const s=S.sel,v=verdict(s.score),a=s.anc;
  const shops=[];for(const p of s.parts.filter(p=>p.frac>=.15))for(const x of (BIZ[p.i]||[]))if(x[0]===0)shops.push([x[1],x[3]||'',x[2],P(p.i)[0]+P(p.i)[1]]);
  shops.sort((x,y)=>y[2]-x[2]);
  const ym=d=>d?`${Math.floor(d/10000)}/${String(Math.floor(d/100)%100).padStart(2,'0')}`:'';
  const g=`${s.ll.lat.toFixed(6)},${s.ll.lng.toFixed(6)}`;
  document.getElementById('res').innerHTML=`
   <div class="score"><div class="n" style="color:${v[1]}">${s.score}</div><div><div class="v" style="color:${v[1]}">${v[0]}</div><div class="sub">${a[1]}${a[2]}・走路 ${Math.round(S.r/72)} 分鐘內</div></div></div>
   <div class="lines">
    <div><b>人流</b><span>${s.hasMrt?`附近捷運每天約 ${(s.mflow/1e4).toFixed(1)} 萬人次${s.top?`（${s.top[0].replace(/^[A-Z]/,'')}站）`:''}・`:''}來客熱度 ${Math.round(s.visit)} 分・百貨商場 ${s.mall} 家</span><em>${Math.round(s.flow)}</em></div>
    <div><b>客群</b><span>女性 20–44 歲 ${fmt(s.f)} 人・消費熱度 ${Math.round(s.spend)} 分${s.dp?`・${a[1]}白天平日 ${(s.dp[0]/1e4).toFixed(1)} 萬／假日 ${(s.dp[1]/1e4).toFixed(1)} 萬人`:''}</span><em>${Math.round(s.cust)}</em></div>
    <div><b>美業</b><span>美甲 ${fmt(s.nail)} 家・美容美髮 ${fmt(s.other)} 家（越多代表保養習慣越強）</span><em>${Math.round(s.heat)}</em></div>
   </div>
   <div class="sub">指數＝人流 40%＋客群 30%＋美業熱度 30%，右側是各項得分。白天人口是整個行政區的數字（2020 年電信信令）。</div>
   <div class="btns"><button class="btn dark" onclick="addCmp()">加入比較</button><a class="btn" target="_blank" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${g}">街景</a></div>
   <details><summary>美甲店名單（${shops.length}）</summary><table>${shops.slice(0,100).map(x=>`<tr><td class="ad">${x[0]}${x[1]?`<div><a class="sub" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x[3]+x[1])}">${x[1]}</a></div>`:''}</td><td class="sub">${ym(x[2])}</td></tr>`).join('')}</table></details>`;
}
function addCmp(){const s=S.sel;S.cmp.push({name:s.anc[1]+s.anc[2],score:s.score,flow:s.flow,cust:s.cust,heat:s.heat});if(S.cmp.length>6)S.cmp.shift();renderCmp()}
function renderCmp(){
  const c=document.getElementById('cmp');c.style.display=S.cmp.length?'':'none';
  c.innerHTML=`<table><tr><th>位置</th><th>指數</th><th>人流</th><th>客群</th><th>美業</th><th></th></tr>
   ${S.cmp.map((x,j)=>`<tr><td>${x.name}</td><td><b>${x.score}</b></td><td>${Math.round(x.flow)}</td><td>${Math.round(x.cust)}</td><td>${Math.round(x.heat)}</td><td><button class="x" onclick="S.cmp.splice(${j},1);renderCmp()">✕</button></td></tr>`).join('')}</table>`;
}
document.getElementById('range').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.r=+b.dataset.r;
  document.querySelectorAll('#range button').forEach(x=>x.classList.toggle('on',x===b));if(S.sel)pick(S.sel.ll)};

const q=document.getElementById('q'),sres=document.getElementById('sres');
function go(ll){map.flyTo(ll,15);pick(ll)}
q.oninput=()=>{const t=q.value.trim().replace(/台/g,'臺');if(!t){sres.style.display='none';return}
  const out=[];D.props.forEach((p,i)=>{if(out.length<8&&(p[0]+p[1]+p[2]).includes(t)||out.length<8&&(p[1]+p[2]).includes(t))out.push(i)});
  sres.innerHTML=out.map(i=>`<div data-i="${i}">${P(i)[2]} <span class="sub">${P(i)[0]}${P(i)[1]}</span></div>`).join('')+`<div data-addr="1">🔍 搜尋地址「${q.value.trim()}」（或按 Enter）</div>`;
  sres.style.display='block'};
sres.onclick=async e=>{const d=e.target.closest('div');if(!d)return;sres.style.display='none';
  if(d.dataset.i){const c=turf.pointOnFeature(feats[+d.dataset.i]).geometry.coordinates;go(L.latLng(c[1],c[0]));q.value='';return}
  findAddr(q.value.trim())};
q.onkeydown=e=>{if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;e.preventDefault();sres.style.display='none';findAddr(q.value.trim())};
const CN={'零':0,'〇':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnNum(t){let n=0,cur=0;for(const ch of t){if(ch in CN)cur=CN[ch];else if(ch==='十'){n+=(cur||1)*10;cur=0}else if(ch==='百'){n+=(cur||1)*100;cur=0}else if(ch==='千'){n+=(cur||1)*1000;cur=0}}return n+cur}
function normAddr(t){
  t=t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\s+/g,'').replace(/台/g,'臺');
  return t.replace(/([零〇一二兩三四五六七八九十百千]+)(?=[巷弄號樓之])/g,m=>cnNum(m));
}
function candidates(t){
  const out=[t];
  const cuts=[/(\d+樓.*|之\d+.*)$/,/\d+號.*$/,/\d+弄.*$/,/\d+巷.*$/];
  let cur=t;for(const r of cuts){const n=cur.replace(r,'');if(n&&n!==cur){out.push(n);cur=n}}
  return [...new Set(out)];
}
const TYPE={PointAddress:'門牌',StreetAddress:'門牌附近',StreetName:'路段／巷弄',Locality:'區域',POI:'地標',Neighborhood:'區域'};
async function arcgis(t){
  const u='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&countryCode=TWN&maxLocations=1&outFields=Addr_type,Match_addr&SingleLine='+encodeURIComponent(t);
  const r=await fetch(u).then(r=>r.json());const c=r.candidates&&r.candidates[0];
  return c&&c.score>=80?{lat:c.location.y,lng:c.location.x,label:c.attributes.Match_addr||c.address,type:c.attributes.Addr_type}:null;
}
async function nominatim(t){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=tw&limit=1&accept-language=zh-TW&q='+encodeURIComponent(t)).then(r=>r.json());
  return r[0]?{lat:+r[0].lat,lng:+r[0].lon,label:t,type:'Locality'}:null;
}
async function findAddr(raw){if(!raw)return;
  const t=normAddr(raw);const hint=document.getElementById('hint');
  hint.textContent='搜尋中…';hint.style.display='block';
  for(const c of candidates(t)){let hit=null;
    try{hit=await arcgis(c)}catch(e){}
    if(!hit){try{hit=await nominatim(c)}catch(e){}}
    if(hit){const exact=c===t&&hit.type==='PointAddress';
      hint.innerHTML=`📍 ${hit.label.replace(/,\s*\d+$/,'')}　<span class="sub">${exact?'精確門牌':'約略位置（'+(TYPE[hit.type]||'附近')+'）'}</span>`;
      q.value='';go(L.latLng(hit.lat,hit.lng));return}}
  hint.innerHTML='找不到這個地址，試試加上區名，例如「大安區延吉街」';
}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sres.style.display='none'});
init();
</script>
</body>
</html>
